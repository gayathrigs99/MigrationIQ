# Labeled evaluation set for MigrationIQ.
#
# Fields
#   expected_constructs     names the SqlAnalyzer should detect in oracle_sql (exact set)
#   relevant_sections       knowledge base sections a good retriever should return,
#                           written as "<file>::<section heading>"
#   expected_pg_sql         a reference conversion; it must pass the ValidationService
#   manual_review_expected  true when a human should look at the conversion
#
# expected_pg_sql is ONE acceptable answer, not the only one. Run it on PostgreSQL
# and compare behaviour with Oracle before trusting any case as ground truth.

# ---------------------------------------------------------------- functions
- id: nvl-basic
  category: functions
  oracle_sql: |
    SELECT NVL(commission, 0) FROM employees
  expected_pg_sql: |
    SELECT COALESCE(commission, 0) FROM employees
  expected_constructs: [NVL]
  relevant_sections: ["oracle_functions.md::NVL to COALESCE"]
  manual_review_expected: false

- id: nvl2-basic
  category: functions
  oracle_sql: |
    SELECT NVL2(commission, 'Paid', 'None') FROM employees
  expected_pg_sql: |
    SELECT CASE WHEN commission IS NOT NULL THEN 'Paid' ELSE 'None' END FROM employees
  expected_constructs: [NVL2]
  relevant_sections: ["oracle_functions.md::NVL2 to CASE"]
  manual_review_expected: false

