    WITH RECURSIVE tree AS (
      SELECT id, name, manager_id, 1 AS level FROM employees WHERE manager_id IS NULL
      UNION ALL
      SELECT e.id, e.name, e.manager_id, t.level + 1
      FROM employees e JOIN tree t ON e.manager_id = t.id
    )
    SELECT id, name, level FROM tree
  expected_constructs: [CONNECT_BY]
  relevant_sections: ["oracle_functions.md::CONNECT BY to WITH RECURSIVE"]
  manual_review_expected: true

- id: merge-upsert
  category: functions
  oracle_sql: |
    MERGE INTO accounts a
    USING staging s ON (a.id = s.id)
    WHEN MATCHED THEN UPDATE SET a.balance = s.balance
    WHEN NOT MATCHED THEN INSERT (id, balance) VALUES (s.id, s.balance)
  expected_pg_sql: |
    INSERT INTO accounts (id, balance)
    SELECT id, balance FROM staging
    ON CONFLICT (id) DO UPDATE SET balance = EXCLUDED.balance
  expected_constructs: [MERGE]
  relevant_sections: ["oracle_functions.md::MERGE"]
  manual_review_expected: true

