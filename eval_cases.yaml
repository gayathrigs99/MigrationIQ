      END LOOP;
    END;
  expected_pg_sql: |
    CREATE OR REPLACE PROCEDURE give_raises()
    LANGUAGE plpgsql AS $$
    BEGIN
      FOR r IN SELECT id, salary FROM employees LOOP
        UPDATE employees SET salary = r.salary * 1.05 WHERE id = r.id;
      END LOOP;
    END;
    $$;
  expected_constructs: [ROUTINE_DEFINITION]
  relevant_sections:
    - "cursor_migration.md::Cursor FOR loop"
    - "cursor_migration.md::Prefer set-based SQL"
  manual_review_expected: false

- id: procedure-ref-cursor
