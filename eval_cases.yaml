- id: function-select-into-no-data-found
  category: exceptions
  oracle_sql: |
    CREATE OR REPLACE FUNCTION get_name(p_id IN NUMBER) RETURN VARCHAR2 IS
      v_name VARCHAR2(100);
    BEGIN
      SELECT name INTO v_name FROM employees WHERE id = p_id;
      RETURN v_name;
    EXCEPTION
      WHEN NO_DATA_FOUND THEN
        RETURN NULL;
    END;
  expected_pg_sql: |
    CREATE OR REPLACE FUNCTION get_name(p_id integer) RETURNS varchar
    LANGUAGE plpgsql AS $$
    DECLARE
      v_name varchar(100);
    BEGIN
      SELECT name INTO STRICT v_name FROM employees WHERE id = p_id;
      RETURN v_name;
    EXCEPTION
      WHEN no_data_found THEN
        RETURN NULL;
    END;
    $$;
  expected_constructs: [ROUTINE_DEFINITION, NUMBER, VARCHAR2, EXCEPTION_BLOCK]
  relevant_sections:
    - "exception_handling.md::SELECT INTO and NO_DATA_FOUND"
    - "exception_handling.md::Exception block syntax"
    - "procedure_migration.md::Function structure"
  manual_review_expected: false

- id: procedure-raise-application-error
  category: exceptions
  oracle_sql: |
    CREATE OR REPLACE PROCEDURE withdraw(p_id IN NUMBER, p_amount IN NUMBER) IS
      v_balance NUMBER;
    BEGIN
      SELECT balance INTO v_balance FROM accounts WHERE id = p_id;
      IF v_balance < p_amount THEN
        RAISE_APPLICATION_ERROR(-20001, 'Insufficient balance');
      END IF;
      UPDATE accounts SET balance = balance - p_amount WHERE id = p_id;
    END;
  expected_pg_sql: |
    CREATE OR REPLACE PROCEDURE withdraw(p_id integer, p_amount numeric)
    LANGUAGE plpgsql AS $$
    DECLARE
      v_balance numeric;
    BEGIN
      SELECT balance INTO STRICT v_balance FROM accounts WHERE id = p_id;
      IF v_balance < p_amount THEN
        RAISE EXCEPTION 'Insufficient balance' USING ERRCODE = 'P0001';
      END IF;
      UPDATE accounts SET balance = balance - p_amount WHERE id = p_id;
    END;
    $$;
  expected_constructs: [ROUTINE_DEFINITION, NUMBER, RAISE_APPLICATION_ERROR]
  relevant_sections:
    - "exception_handling.md::RAISE_APPLICATION_ERROR"
    - "exception_handling.md::SELECT INTO and NO_DATA_FOUND"
    - "procedure_migration.md::Procedure structure"
  manual_review_expected: true

