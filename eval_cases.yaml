# ----------------------------------------------------------------- cursors
- id: procedure-explicit-cursor
  category: cursors
  oracle_sql: |
    CREATE OR REPLACE PROCEDURE print_employees(p_dept IN NUMBER) IS
      CURSOR c_emp IS SELECT id, name FROM employees WHERE dept_id = p_dept;
      v_id NUMBER;
      v_name VARCHAR2(100);
    BEGIN
      OPEN c_emp;
      LOOP
        FETCH c_emp INTO v_id, v_name;
        EXIT WHEN c_emp%NOTFOUND;
        DBMS_OUTPUT.PUT_LINE(v_id || ' ' || v_name);
      END LOOP;
      CLOSE c_emp;
    END;
  expected_pg_sql: |
    CREATE OR REPLACE PROCEDURE print_employees(p_dept integer)
    LANGUAGE plpgsql AS $$
    DECLARE
      c_emp CURSOR FOR SELECT id, name FROM employees WHERE dept_id = p_dept;
      v_id integer;
      v_name varchar(100);
    BEGIN
      OPEN c_emp;
      LOOP
        FETCH c_emp INTO v_id, v_name;
        EXIT WHEN NOT FOUND;
        RAISE NOTICE '% %', v_id, v_name;
      END LOOP;
      CLOSE c_emp;
    END;
    $$;
  expected_constructs: [ROUTINE_DEFINITION, NUMBER, VARCHAR2, EXPLICIT_CURSOR, DBMS_OUTPUT]
  relevant_sections:
    - "cursor_migration.md::Explicit cursor declaration"
    - "cursor_migration.md::Cursor attributes"
    - "procedure_migration.md::DBMS_OUTPUT"
  manual_review_expected: false

- id: procedure-cursor-for-loop
