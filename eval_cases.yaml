# ---------------------------------------------------- several constructs at once
- id: combined-join-nvl-decode-rownum
  category: combined
  oracle_sql: |
    SELECT e.name, NVL(d.name, 'none'), DECODE(e.status, 'A', 1, 0)
    FROM employees e, departments d
    WHERE e.dept_id = d.id(+) AND ROWNUM <= 20
  expected_pg_sql: |
    SELECT e.name, COALESCE(d.name, 'none'), CASE e.status WHEN 'A' THEN 1 ELSE 0 END
    FROM employees e LEFT JOIN departments d ON e.dept_id = d.id
    LIMIT 20
  expected_constructs: [NVL, DECODE, OUTER_JOIN_PLUS, ROWNUM]
  relevant_sections:
    - "oracle_functions.md::NVL to COALESCE"
    - "oracle_functions.md::DECODE to CASE"
    - "oracle_functions.md::Oracle outer join operator (+)"
    - "oracle_functions.md::ROWNUM to LIMIT"
  manual_review_expected: true

