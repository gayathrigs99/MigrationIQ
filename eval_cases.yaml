- id: procedure-bulk-collect-forall
  category: cursors
  oracle_sql: |
    CREATE OR REPLACE PROCEDURE bump_dept(p_dept IN NUMBER) IS
      TYPE t_ids IS TABLE OF employees.id%TYPE;
      v_ids t_ids;
    BEGIN
      SELECT id BULK COLLECT INTO v_ids FROM employees WHERE dept_id = p_dept;
      FORALL i IN 1..v_ids.COUNT
        UPDATE employees SET salary = salary * 1.1 WHERE id = v_ids(i);
    END;
  expected_pg_sql: |
    CREATE OR REPLACE PROCEDURE bump_dept(p_dept integer)
    LANGUAGE plpgsql AS $$
    BEGIN
      UPDATE employees SET salary = salary * 1.1 WHERE dept_id = p_dept;
    END;
    $$;
  expected_constructs: [ROUTINE_DEFINITION, NUMBER, BULK_COLLECT, FORALL]
  relevant_sections:
    - "cursor_migration.md::BULK COLLECT"
    - "cursor_migration.md::FORALL"
    - "cursor_migration.md::PL/SQL collections"
    - "cursor_migration.md::Prefer set-based SQL"
  manual_review_expected: true

# ------------------------------------------- advanced procedural constructs
- id: procedure-autonomous-transaction
  category: procedures
  oracle_sql: |
    CREATE OR REPLACE PROCEDURE write_audit(p_msg IN VARCHAR2) IS
      PRAGMA AUTONOMOUS_TRANSACTION;
    BEGIN
      INSERT INTO audit_log (message) VALUES (p_msg);
      COMMIT;
    END;
  expected_pg_sql: |
    -- Requires the dblink extension (loop-back connection emulates the autonomous commit).
    CREATE OR REPLACE PROCEDURE write_audit(p_msg varchar)
    LANGUAGE plpgsql AS $$
    BEGIN
      PERFORM dblink_exec(
        'dbname=' || current_database(),
        format('INSERT INTO audit_log (message) VALUES (%L)', p_msg)
      );
    END;
    $$;
  expected_constructs: [ROUTINE_DEFINITION, VARCHAR2, PRAGMA_AUTONOMOUS_TRANSACTION]
  relevant_sections:
    - "procedure_migration.md::PRAGMA AUTONOMOUS_TRANSACTION"
    - "procedure_migration.md::Transaction control"
  manual_review_expected: true

- id: function-dynamic-sql
  category: procedures
  oracle_sql: |
    CREATE OR REPLACE FUNCTION count_rows(p_table IN VARCHAR2, p_id IN NUMBER) RETURN NUMBER IS
      v_count NUMBER;
    BEGIN
      EXECUTE IMMEDIATE 'SELECT COUNT(*) FROM ' || p_table || ' WHERE id = :1' INTO v_count USING p_id;
      RETURN v_count;
    END;
  expected_pg_sql: |
    CREATE OR REPLACE FUNCTION count_rows(p_table varchar, p_id integer) RETURNS numeric
    LANGUAGE plpgsql AS $$
    DECLARE
      v_count numeric;
    BEGIN
      EXECUTE format('SELECT COUNT(*) FROM %I WHERE id = $1', p_table) INTO v_count USING p_id;
      RETURN v_count;
    END;
    $$;
  expected_constructs: [ROUTINE_DEFINITION, VARCHAR2, NUMBER, EXECUTE_IMMEDIATE]
  relevant_sections:
    - "procedure_migration.md::Dynamic SQL"
    - "procedure_migration.md::Function structure"
  manual_review_expected: true

- id: trigger-before-update
  category: procedures
  oracle_sql: |
    CREATE OR REPLACE TRIGGER trg_set_updated
    BEFORE UPDATE ON employees
    FOR EACH ROW
    BEGIN
      :NEW.updated_at := SYSDATE;
    END;
  expected_pg_sql: |
    CREATE OR REPLACE FUNCTION trg_set_updated_fn() RETURNS trigger
    LANGUAGE plpgsql AS $$
    BEGIN
      NEW.updated_at := LOCALTIMESTAMP;
      RETURN NEW;
    END;
    $$;

    CREATE TRIGGER trg_set_updated BEFORE UPDATE ON employees
    FOR EACH ROW EXECUTE FUNCTION trg_set_updated_fn();
  expected_constructs: [SYSDATE]
  relevant_sections:
    - "procedure_migration.md::Triggers"
    - "oracle_functions.md::SYSDATE to CURRENT_TIMESTAMP"
  manual_review_expected: false

